name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Only one run per branch/PR wins; tags and main are never cancelled.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: ${{ matrix.name }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # macOS is deliberately absent: it is built locally on the Mac (npx tauri
      # build). This keeps the private-repo minute cost down, since macOS runners
      # bill at 10x while Windows is 2x and Linux is 1x.
      matrix:
        include:
          - name: Windows
            platform: windows-latest
            args: ''
            artifact: windows-x64
          - name: Linux
            platform: ubuntu-22.04
            args: ''
            artifact: linux-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # Caches the Cargo registry and the compiled dependencies, which is most of
      # a Tauri build's wall time.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.artifact }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      # No tag → build only (artifacts are uploaded below). Tag pushed → the
      # action creates/updates the GitHub Release and attaches the bundles.
      - name: Build the app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('The Recipe App {0}', github.ref_name) || '' }}
          releaseBody: 'Download the installer for your platform from the assets below.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Always keep the built installers downloadable from the run itself.
      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm

      # The Microsoft Store package. Tauri cannot emit MSIX, so this stages the
      # built app and runs MakeAppx over it (see scripts/build-msix.ps1).
      #
      # The Partner Center identity lives in a gitignored file, so it is passed
      # in through repository variables rather than committed.
      - name: Build the Microsoft Store package
        if: matrix.artifact == 'windows-x64'
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_IDENTITY_PUBLISHER: ${{ vars.MSIX_IDENTITY_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MSIX_IDENTITY_NAME) -or
              [string]::IsNullOrWhiteSpace($env:MSIX_IDENTITY_PUBLISHER)) {
            Write-Host "::warning::MSIX identity variables are not set, so no Store package was built."
            Write-Host "Set MSIX_IDENTITY_NAME, MSIX_IDENTITY_PUBLISHER and MSIX_PUBLISHER_DISPLAY_NAME"
            Write-Host "under Settings > Secrets and variables > Actions > Variables."
            exit 0
          }

          # build-msix.ps1 reads this file, so write it from the variables.
          $identity = [ordered]@{
            identityName          = $env:MSIX_IDENTITY_NAME
            identityPublisher     = $env:MSIX_IDENTITY_PUBLISHER
            publisherDisplayName  = $env:MSIX_PUBLISHER_DISPLAY_NAME
          }
          $identity | ConvertTo-Json | Set-Content src-tauri/msix/identity.json -Encoding UTF8

          # Locate MakeAppx in the Windows SDK. The windows-latest image has the
          # SDK, but not the Developer PowerShell environment that normally puts
          # it on PATH.
          #
          # The path is passed to the script directly rather than added to
          # GITHUB_PATH: GITHUB_PATH only affects *later* steps, so a step that
          # adds it and then runs MakeAppx in the same step would still fail.
          $sdkBin = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Directory |
            Where-Object { $_.Name -match '^10\.' } |
            Sort-Object Name -Descending |
            Select-Object -First 1 |
            ForEach-Object { Join-Path $_.FullName "x64" }
          $makeAppx = if ($sdkBin) { Join-Path $sdkBin "MakeAppx.exe" } else { "" }
          if (-not $makeAppx -or -not (Test-Path $makeAppx)) {
            Write-Host "::error::MakeAppx.exe not found in the Windows SDK."
            exit 1
          }
          Write-Host "Using MakeAppx from $makeAppx"

          pwsh scripts/build-msix.ps1 -Package -MakeAppxPath $makeAppx

      - name: Upload the Store package
        if: matrix.artifact == 'windows-x64' && hashFiles('src-tauri/target/msix/*.msix') != ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-store-msix
          if-no-files-found: error
          retention-days: 14
          path: src-tauri/target/msix/*.msix
