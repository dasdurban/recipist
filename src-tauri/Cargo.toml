[package]
name = "recipist"
version = "0.1.0"
description = "A personal recipe organiser"
authors = ["Victor <dasleveille@gmail.com>"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "recipist_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-log = "2"
base64 = "0.22"
reqwest = { version = "0.12", features = ["gzip", "brotli", "deflate"] }
tauri-plugin-opener = "2.7.2"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-fs = "2.7.1"
tauri-plugin-deep-link = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

# `tauri-plugin-deep-link` 2.6.2 does not compile against `rust-ini` 0.21.3,
# which added two fields to `ini::ParseOption`. The affected code is Linux-only,
# so only the Linux build breaks. There is no newer stable 2.x to move to, and
# the last compatible `rust-ini` was yanked, so the plugin is patched locally
# instead. See src-tauri/vendor/tauri-plugin-deep-link/README.md.
[patch.crates-io]
tauri-plugin-deep-link = { path = "vendor/tauri-plugin-deep-link" }
